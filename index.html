<body>
<div id="boot">
 <div class="boot-card"><div class="brand"><span class="winmark"><i></i><i></i><i></i><i></i></span> WINDOWS BASIC QUEST</div>
 <h1>Siap menggunakan komputer?</h1><p>Simulasi desktop seperti komputer sungguhan.<br>Masukkan namamu, lalu tekan tombol Power.</p>
 <input class="boot-name" id="studentName" placeholder="Ketik nama siswa" maxlength="45" autocomplete="off" aria-label="Nama siswa">
 <button class="power-orb" id="bootPower" aria-label="Nyalakan komputer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v10m6.4-6.1a9 9 0 1 1-12.8 0"/></svg></button>
 <div>TEKAN POWER UNTUK MENYALAKAN</div><div id="bootStatus" class="boot-status"></div>
 <div class="boot-note">Media simulasi offline · KKA Kelas 7 · Tidak mengubah sistem Windows asli</div></div>
</div>
<div id="os" class="hide"><div class="wallpaper"></div><div class="ambient"></div>
 <div id="desktop-icons"></div><div id="windowLayer" class="window-layer"></div><div id="missionDock" class="mission-dock"></div>
 <div id="startMenu" class="start-menu hide"></div><div id="powerFlyout" class="power-flyout hide"></div>
 <div class="taskbar"><div class="task-lesson"><span class="lesson-dot"></span><span>KKA KELAS 7 · VIRTUAL DESKTOP</span></div><div id="taskCenter" class="task-center"></div><div class="tray"><div class="tray-signals">⌁ ◖◖ ◧</div><div class="tray-time" id="trayTime"></div></div></div>
 <div id="toast" class="toast hide"></div><div id="modalCover" class="modal-cover hide"></div><div id="winScreen" class="win-screen hide"></div>
</div>
<script>

const TARGET15='Hari ini saya belajar Windows.';

 {title:'Nyalakan Komputer!',level:'Pengenalan',desc:'Sebelum bekerja, komputer harus menyala. Masukkan nama dan hidupkan komputer lewat tombol Power.',target:'Nyalakan komputer sampai tampilan desktop muncul.',hint:'Isi nama siswa, lalu klik tombol Power pada layar awal.'},
 {title:'Jelajahi Desktop',level:'Pengenalan',desc:'Ada ikon Recycle Bin pada desktop. Buka tempat sampah itu dengan double-click, lalu tutup jendelanya.',target:'Recycle Bin pernah terbuka, kemudian ditutup.',hint:'Double-click ikon Recycle Bin di sisi kiri layar. Untuk menutup, tekan X di kanan atas jendela.'},
 {title:'Temukan Aplikasi',level:'Pengenalan',desc:'Tidak semua aplikasi berada di desktop. Temukan dan buka Notepad menggunakan menu Start.',target:'Notepad terbuka dari Start Menu.',hint:'Klik logo empat kotak di taskbar. Pilih Notepad dari daftar aplikasi.'},
 {title:'Catatan Pertamaku',level:'Aplikasi',desc:`Tulis kalimat tepat berikut di Notepad: “${TARGET1}”. Kemudian simpan menjadi Catatan KKA.txt.`,target:'Isi dan nama file harus sesuai; file tersimpan di Documents.',hint:'Ketik di Notepad, pilih File → Save / Save As, isi nama Catatan KKA.txt, lalu klik Simpan.'},

 {title:'Temukan Jendela Tersembunyi',level:'Aplikasi',desc:'Notepad masih berjalan walaupun tidak terlihat. Tampilkan kembali dari taskbar.',target:'Notepad kembali terlihat setelah diklik melalui taskbar.',hint:'Cari ikon Notepad di taskbar bawah; klik sekali.'},

const BADGES=[{at:3,name:'Desktop Explorer',icon:'🖥️'},{at:7,name:'Window Rookie',icon:'🪟'},{at:10,name:'Window Manager',icon:'🧩'},{at:14,name:'Data Guardian',icon:'🛡️'},{at:17,name:'File Explorer Rookie',icon:'📂'},{at:19,name:'File Organizer',icon:'🗂️'},{at:20,name:'COMPUTER MASTER',icon:'🏆'}];
const by=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function initial(){return{name:'',owner:'',active:0,done:Array(20).fill(false),xp:0,errors:0,attempts:Array(20).fill(0),files:[{id:'sample',name:'Petunjuk Lab.txt',folder:'Documents',type:'file',content:'Selamat belajar mengoperasikan komputer!\nGunakan komputer dengan bertanggung jawab.'},{id:'image0',name:'Pemandangan.png',folder:'Pictures',type:'image',content:''},{id:'old1',name:'Catatan Lama.txt',folder:'Recycle Bin',type:'file',content:'Latihan terdahulu'}]};}
function load(){try{const old=JSON.parse(localStorage.getItem(STORE));if(old&&typeof old==='object'){if(old.done?.length===15){old.done=[...old.done.slice(0,14),false,false,false,false,false,!!old.done[14]];old.attempts=[...(old.attempts||[]).slice(0,14),0,0,0,0,0,old.attempts?.[14]||0];old.active=old.active===14?19:old.active;}const fresh=initial();return {...fresh,...old,done:Array.from({length:20},(_,i)=>!!old.done?.[i]),attempts:Array.from({length:20},(_,i)=>Math.max(0,Number(old.attempts?.[i])||0)),files:Array.isArray(old.files)?old.files:fresh.files};}}catch(e){/* continue */}return initial();}
let S=load();
const R={powered:false,booting:false,windows:{},nextZ:11,focused:null,startOpen:false,powerOpen:false,search:'',modal:null,toastTimer:null,selected:null,signals:{},missionWon:false,teacher:false,teacherSnapshot:null,dockCollapsed:false,note:{text:'',fileId:null,saved:''},explorerFolder:'Home',calcText:'0',calcPrev:null,calcOp:null,drag:null,bossStage:0,bossTrace:[],pendingClose:null,forceSaved:false,preload:false};
const APP_LABEL={notepad:'Notepad',explorer:'File Explorer',recycle:'Recycle Bin',calculator:'Calculator'};
function appIcon(name){if(name==='start')return '<span class="winmark"><i></i><i></i><i></i><i></i></span>';return `<span class="app-graphic" aria-hidden="true">${{notepad:'📝',explorer:'📁',recycle:'🗑️',calculator:'🧮',power:'⏻',search:'⌕',home:'⌂'}[name]||'🖥️'}</span>`;}
let storageWarned=false;
function save(){if(R.teacher)return;try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){if(!storageWarned){storageWarned=true;toast('Penyimpanan otomatis tidak tersedia. Gunakan tombol Simpan untuk mengekspor progres.');}}}
function unlocked(){const n=S.done.findIndex(x=>!x);return n<0?19:n;}
function idx(){return R.selected===null?S.active:R.selected;}
function has(id){return !!R.windows[id];}
function visible(id){return !!R.windows[id]&&!R.windows[id].min;}
function missionDone(i){return !!S.done[i];}
function timeTick(){const d=new Date();by('trayTime').innerHTML=`${d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}<br>${d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'})}`;}
timeTick();setInterval(timeTick,30000);
function toast(text){const t=by('toast');t.textContent=text;t.classList.remove('hide');clearTimeout(R.toastTimer);R.toastTimer=setTimeout(()=>t.classList.add('hide'),3400);}
function modal(title,body,buttons){R.modal={title,body,buttons};by('modalCover').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><div>${body}</div><div class="modal-actions">${buttons.map((b,i)=>`<button class="${b.primary?'primary':'secondary'}" data-modal-button="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;by('modalCover').classList.remove('hide');}
function closeModal(){R.modal=null;by('modalCover').classList.add('hide');by('modalCover').innerHTML='';}
function signal(name){R.signals[name]=true;evaluate(false);}
function defaultWindow(app){const W=Math.max(700,innerWidth), H=Math.max(520,innerHeight-60);const n=Object.keys(R.windows).length;const width=app==='calculator'?345:app==='notepad'?590:680;return {x:Math.min(W-width-12,Math.max(95,155+n*32)),y:Math.min(H-360,100+n*24),w:Math.min(width,W-22),h:app==='calculator'?440:Math.min(455,H-35),min:false,max:false,prev:null,z:++R.nextZ};}
function focusWin(app){const w=R.windows[app];if(!w)return;w.z=++R.nextZ;R.focused=app;renderWindows();renderTaskbar();}
function launch(app,source='other',options={}){if(!R.powered)return;R.startOpen=false;R.powerOpen=false;by('startMenu').classList.add('hide');by('powerFlyout').classList.add('hide');if(R.windows[app]){R.windows[app].min=false;focusWin(app);}else{R.windows[app]=defaultWindow(app);if(app==='notepad'&&!options.keepNote)R.note={text:'',fileId:null,saved:''};if(app==='explorer'&&!options.keepFolder)R.explorerFolder='Home';if(app==='recycle')R.explorerFolder='Recycle Bin';if(app==='calculator')R.calcText='0';focusWin(app);}if(app==='recycle')R.signals.openedRecycle=true;if(app==='notepad'&&source==='start')R.signals.notepadStart=true;if(app==='calculator'&&source==='search')R.signals.calcSearch=true;bossEvent('open',app,source);renderTaskbar();renderHud();evaluate(false);}
function closeWin(app,force=false){if(!has(app))return;if(app==='notepad'&&!force&&R.note.text!==R.note.saved){R.pendingClose=app;R.signals.sawUnsavedPrompt=true;modal('Perubahan belum disimpan',`<p>Notepad memiliki perubahan yang belum disimpan. Apa yang ingin kamu lakukan?</p><p class="notice">Untuk menjaga pekerjaan, pilih <b>Simpan</b> sebelum menutup.</p>`,[{label:'Batal',cb:()=>{R.pendingClose=null;}},{label:'Jangan Simpan',cb:()=>{R.pendingClose=null;closeWin(app,true);}},{label:'Simpan',primary:true,cb:()=>{R.forceSaved=true;saveNote(true);}}]);return;}
 delete R.windows[app];R.signals.closedApp=true;if(app==='recycle')R.signals.recycleClosed=true;if(R.focused===app)R.focused=Object.keys(R.windows)[0]||null;renderWindows();renderTaskbar();bossEvent('close',app);evaluate(false);placeHud();}
function minimizeWin(app){if(!has(app))return;R.windows[app].min=true;if(R.focused===app)R.focused=null;renderWindows();renderTaskbar();evaluate(false);placeHud();}
function taskApp(app){if(!has(app)){launch(app,'taskbar');return;}const w=R.windows[app];if(w.min){w.min=false;R.signals.restoredFromTaskbar=app==='notepad';}else if(R.focused===app){w.min=true;R.focused=null;renderWindows();renderTaskbar();return;}R.focused=app;w.z=++R.nextZ;R.signals['taskSwitch'+app]=true;bossEvent('task',app);renderWindows();renderTaskbar();evaluate(false);}
function maximizeWin(app){const w=R.windows[app];if(!w)return;if(w.max){Object.assign(w,w.prev||{});w.max=false;w.prev=null;if(app==='notepad'&&R.signals.maxNotepad)R.signals.maxThenRestored=true;}else{w.prev={x:w.x,y:w.y,w:w.w,h:w.h};Object.assign(w,{x:0,y:0,w:innerWidth,h:innerHeight-60,max:true});if(app==='notepad')R.signals.maxNotepad=true;}focusWin(app);evaluate(false);placeHud();}
function changeExplorer(folder){if(!isVirtualFolder(folder))return;R.explorerFolder=folder;R.selectedFile=null;renderWindows();}
function isVirtualFolder(n){return ['Home','Desktop','Documents','Downloads','Pictures','Recycle Bin'].includes(n)||S.files.some(f=>f.type==='folder'&&f.name===n);}
function folderTrail(folder){if(folder==='Home')return ['Home'];if(['Desktop','Documents','Downloads','Pictures','Recycle Bin'].includes(folder))return ['Home',folder];return ['Home','Documents',folder];}
function buildExplorer(){const F=R.explorerFolder;const items=F==='Home'?['Desktop','Documents','Downloads','Pictures','Recycle Bin'].map(n=>({id:'builtin-'+n,name:n,type:'folder',builtin:true})):S.files.filter(f=>f.folder===F);const selected=R.selectedFile;
 return `<div class="explorer-wrap"><div class="mini-toolbar"><button data-file-op="new">＋ Folder baru</button><button data-file-op="rename">✎ Rename</button><button data-file-op="copy">⧉ Copy</button><button data-file-op="cut">✂ Cut</button><button data-file-op="paste">▣ Paste</button><button data-file-op="delete">🗑 Delete</button></div><div class="explorer-nav"><button title="Kembali" data-explorer-back>←</button><button data-folder="Home">⌂</button><div class="address">${folderTrail(F).map(x=>esc(x)).join('　›　')}</div></div><div class="explorer-content"><div class="explorer-side">${['Home','Desktop','Documents','Downloads','Pictures','Recycle Bin'].map(n=>`<button class="${n===F?'chosen':''}" data-folder="${esc(n)}">📁　${esc(n)}</button>`).join('')}</div><div class="explorer-list"><div class="file-hint">Klik satu kali untuk memilih · dua kali untuk membuka</div>${items.length?items.map(f=>`<button class="file-row ${selected===f.id?'selected':''}" data-file-id="${esc(f.id)}" data-file-folder="${f.type==='folder'?esc(f.name):''}" title="Klik untuk memilih, double-click untuk membuka"><span class="app-graphic">${f.type==='folder'?'📁':f.type==='image'?'🖼️':'📄'}</span><span>${esc(f.name)}</span><small>${f.type==='folder'?'Folder':f.type==='image'?'PNG':'TXT'}</small></button>`).join(''):'<p class="empty-folder">Folder ini kosong.</p>'}</div></div><div class="win-status">${items.length} item · ${selected?'1 dipilih · ':''} ${esc(F)} ${R.clipboard?'· Clipboard: '+esc(R.clipboard.kind):''}</div></div>`;
}
function explorerOperation(op){const F=R.explorerFolder,f=S.files.find(x=>x.id===R.selectedFile),ask=(title,label,def,cb)=>modal(title,`<p>${label}</p><input id="explorerEntry" value="${esc(def||'')}" maxlength="85" style="width:100%;padding:11px;border:1px solid #adc4d9;border-radius:8px">`,[{label:'Batal',cb:()=>{}},{label:'OK',primary:true,keep:true,cb:()=>{const val=by('explorerEntry').value.trim();if(!val){toast('Nama belum diisi.');return false;}return cb(val);}}]);
 if(op==='new'){if(F==='Home'||F==='Recycle Bin'){toast('Buka Documents dahulu untuk membuat folder.');return;}ask('Folder baru','Nama folder:', 'Folder Baru',name=>{if(S.files.some(x=>x.name===name&&x.folder===F)){toast('Nama folder sudah digunakan.');return false;}S.files.push({id:'dir_'+Date.now(),name,folder:F,type:'folder',content:''});save();renderWindows();evaluate(false);return true;});return;}
 if(op==='paste'){if(!R.clipboard||F==='Home'||F==='Recycle Bin'){toast('Pilih file, Copy/Cut, lalu buka folder tujuan.');return;}const src=S.files.find(x=>x.id===R.clipboard.id);if(!src){toast('File tidak ditemukan.');return;}if(src.type==='folder'){toast('Latihan ini memindahkan file, bukan seluruh folder.');return;}if(src.folder===F){toast('Pilih folder tujuan yang berbeda.');return;}if(S.files.some(x=>x.folder===F&&x.name===src.name)){toast('Nama file sudah ada di folder tujuan.');return;}if(R.clipboard.kind==='copy')S.files.push({...src,id:'copy_'+Date.now(),folder:F});else src.folder=F;R.clipboard=null;R.selectedFile=null;save();renderWindows();evaluate(false);return;}
 if(!f){toast('Klik file atau folder yang ingin dikelola terlebih dahulu.');return;}
 if(op==='rename'){ask('Ubah nama','Nama baru:',f.name,name=>{if(S.files.some(x=>x!==f&&x.folder===f.folder&&x.name===name)){toast('Nama sudah dipakai.');return false;}f.name=name;save();renderWindows();evaluate(false);return true;});return;}
 if(op==='copy'||op==='cut'){R.clipboard={id:f.id,kind:op};toast(op==='copy'?'File disalin ke clipboard.':'File siap dipindahkan.');renderWindows();return;}
 if(op==='delete'){if(f.type==='folder'&&S.files.some(x=>x.folder===f.name)){toast('Pindahkan isi folder sebelum menghapusnya.');return;}f.originalFolder=f.folder;f.folder='Recycle Bin';R.selectedFile=null;save();renderWindows();evaluate(false);}
}

function buildNotepad(){return `<div style="height:100%;display:flex;flex-direction:column"><div class="mini-toolbar"><button data-note-action="new">File baru</button><button data-note-action="open">Buka</button><button data-note-action="save">💾 Simpan</button><button data-note-action="saveas">Simpan sebagai</button><span style="margin-left:auto;font-size:11px;color:#758da6">Ctrl + S</span></div><div style="flex:1;min-height:0"><textarea data-notearea class="note-area" spellcheck="false" aria-label="Editor catatan" placeholder="Mulai mengetik catatan di sini...">${esc(R.note.text)}</textarea></div><div class="win-status" id="noteStatus">${R.note.text.split('\n').length} baris · ${R.note.text.length} karakter</div></div>`;}
function buildCalculator(){const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];return `<div class="calc"><div class="calc-screen">${esc(R.calcText)}</div><div class="calc-grid">${keys.map(k=>`<button class="${k==='='?'equals':['+','−','×','÷','%'].includes(k)?'op':''}" data-calc="${esc(k)}">${esc(k)}</button>`).join('')}</div></div>`;}
function windowContent(app){if(app==='notepad')return buildNotepad();if(app==='calculator')return buildCalculator();return buildExplorer();}
function renderWindows(){const layer=by('windowLayer');layer.innerHTML=Object.entries(R.windows).filter(([_,w])=>!w.min).sort((a,b)=>a[1].z-b[1].z).map(([id,w])=>`<div class="window ${R.focused===id?'':'inactive'} ${w.max?'maximized':''}" style="left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${w.z}" data-window="${id}"><div class="titlebar" data-drag-window="${id}">${appIcon(id)}<span class="window-title">${id==='notepad'?esc((S.files.find(f=>f.id===R.note.fileId)?.name)||'Untitled')+' - Notepad':APP_LABEL[id]}</span><div class="title-actions"><button title="Minimize" data-win-action="min" data-app="${id}">─</button><button title="${w.max?'Restore Down':'Maximize'}" data-win-action="max" data-app="${id}">${w.max?'▣':'□'}</button><button class="close" title="Close" data-win-action="close" data-app="${id}">✕</button></div></div><div class="win-body">${windowContent(id)}</div>${!w.max?`<div class="window-resize" title="Tarik sudut untuk mengubah ukuran" data-resize-window="${id}"></div>`:''}</div>`).join('');}
function renderTaskbar(){const run=id=>!!R.windows[id], item=(id,kind='app')=>`<button class="task-btn ${run(id)?'running':''} ${R.focused===id?'focused active':''}" data-task-app="${id}" title="${APP_LABEL[id]||id}">${appIcon(id)}</button>`;by('taskCenter').innerHTML=`<button class="task-btn ${R.startOpen?'active':''}" data-start-toggle title="Start">${appIcon('start')}</button><button class="task-btn" data-start-toggle title="Search" style="font-size:27px">⌕</button>${item('explorer')}${item('notepad')}${item('calculator')}${run('recycle')?item('recycle'):''}`;}
function desktopIcons(){by('desktop-icons').innerHTML=[['recycle','Recycle Bin'],['explorer','This PC'],['notepad','Notepad']].map(([id,name])=>`<button class="desktop-icon" data-desktop-app="${id}" title="Double-click untuk membuka">${appIcon(id)}<span>${name}</span></button>`).join('');}
function renderStart(){if(!R.startOpen){by('startMenu').classList.add('hide');return;}const apps=['explorer','notepad','calculator','recycle'];const q=R.search.trim().toLowerCase();const filtered=apps.filter(x=>APP_LABEL[x].toLowerCase().includes(q)||(x==='calculator'&&'kalkulator'.includes(q)));by('startMenu').innerHTML=`<div class="start-inner"><div class="start-search">🔎 <input id="startSearchInput" placeholder="Cari aplikasi, pengaturan, dan dokumen" value="${esc(R.search)}" autocomplete="off" aria-label="Cari aplikasi"></div><h3>${q?'Hasil pencarian':'Aplikasi disematkan'}</h3>${q?`<div>${filtered.length?filtered.map(id=>`<button class="search-result" data-start-app="${id}" data-source="search">${appIcon(id)}<span><b>${APP_LABEL[id]}</b><small>Aplikasi</small></span></button>`).join(''):'<p style="font-size:12px;color:#7e90a5">Tidak ada aplikasi yang ditemukan.</p>'}</div>`:`<div class="apps-grid">${apps.map(id=>`<button class="app-launch" data-start-app="${id}" data-source="start">${appIcon(id)}<span>${APP_LABEL[id]}</span></button>`).join('')}</div><h3>Direkomendasikan</h3><div class="file-hint">📝 Catatan · 📁 Documents · 🖥️ Komputer</div>`}</div><div class="start-footer"><span style="font-size:12px;font-weight:700">👤 ${esc(S.name)}</span><button title="Power" data-power-toggle style="font-size:22px">⏻</button></div>`;by('startMenu').classList.remove('hide');}
function startToggle(){R.startOpen=!R.startOpen;R.powerOpen=false;R.search='';by('powerFlyout').classList.add('hide');renderStart();renderTaskbar();if(R.startOpen)setTimeout(()=>by('startSearchInput')?.focus(),0);if(R.startOpen)bossEvent('start');}

function exportProgress(){if(R.teacher){toast('Keluar dari Mode Guru sebelum menyimpan progres siswa.');return;}if(!S.owner)S.owner=S.name;save();const data={format:'windows-basic-quest-kka7',version:1,exportedAt:new Date().toISOString(),...S};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='WindowsQuest_'+S.owner.trim().replace(/[^a-zA-Z0-9_-]+/g,'_')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('💾 File progres berhasil dibuat.');}
function importProgress(file){if(R.teacher){toast('Keluar dari Mode Guru untuk mengimpor progres.');return;}if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const a=JSON.parse(reader.result);if(a.format!=='windows-basic-quest-kka7'||!Array.isArray(a.done)||a.done.length!==20&&a.done.length!==15||typeof a.name!=='string'||!Array.isArray(a.files))throw Error('Format salah');if(!window.confirm('Ganti progres saat ini dengan file milik '+a.name+'?'))return;const fresh=initial();S={...fresh,name:a.name.slice(0,45),owner:String(a.owner||a.name).slice(0,45),done:a.done.length===15?[...a.done.slice(0,14).map(Boolean),false,false,false,false,false,!!a.done[14]]:a.done.map(Boolean),attempts:Array.from({length:20},(_,i)=>Math.max(0,Number(a.attempts?.[i])||0)),xp:Math.max(0,Number(a.xp)||0),errors:Math.max(0,Number(a.errors)||0),files:a.files.slice(0,300).map(f=>({id:String(f.id||'')?.slice(0,100),name:String(f.name||'')?.slice(0,130),folder:String(f.folder||'Documents').slice(0,85),type:['folder','file','image'].includes(f.type)?f.type:'file',content:String(f.content||'').slice(0,40000)})),active:0};S.active=unlocked();R.selected=null;R.windows={};R.note={text:'',fileId:null,saved:''};R.powered=true;by('os').classList.remove('hide');by('boot').classList.add('hide');by('winScreen').classList.add('hide');prepMission(S.active);save();toast('📂 Progres berhasil diimpor dari '+S.name+'.');}catch(e){toast('File progres tidak dapat dibaca atau formatnya tidak cocok.');}};reader.readAsText(file);}
function resetDialog(){if(R.teacher){toast('Keluar dari Mode Guru untuk melakukan reset.');return;}modal('Reset data latihan?',`<p><b>Reset Tantangan:</b> menghapus skor, progres, dan catatan simulasi, tetapi tetap menyimpan nama siswa.</p><p><b>Reset Semua:</b> menghapus nama siswa dan semua data latihan di browser ini.</p><p class="notice">Simpan/ekspor progres dulu jika ingin menyimpan hasil sebelumnya.</p>`,[{label:'Batal',cb:()=>{}},{label:'Reset Tantangan',cb:()=>{const name=S.name,owner=S.owner;S=initial();S.name=name;S.owner=owner;R.selected=null;R.bossStage=0;R.windows={};R.powered=true;prepMission(0);save();toast('Progres tantangan telah direset.');}},{label:'Reset Semua Data',primary:true,cb:()=>{S=initial();R.windows={};R.selected=null;R.powered=false;save();by('os').classList.add('hide');by('boot').classList.remove('hide');by('studentName').value='';by('bootStatus').textContent='Semua data telah direset. Masukkan nama untuk memulai.';}}]);}
function powerOn(){if(R.booting)return;const name=(by('studentName').value||'').trim();if(name.length<2){by('bootStatus').textContent='Masukkan nama minimal 2 huruf sebelum mulai.';by('studentName').focus();return;}S.name=name;R.booting=true;by('bootStatus').textContent='Memulai Windows Basic Quest...';save();setTimeout(()=>{R.booting=false;R.powered=true;by('boot').classList.add('hide');by('os').classList.remove('hide');by('winScreen').classList.add('hide');R.selected=null;S.active=S.done.filter(Boolean).length>=20?19:unlocked();desktopIcons();prepMission(S.active);if(S.active===0)evaluate(false);else toast('Selamat datang kembali, '+S.name+'!');},700);}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('Mode layar penuh tidak didukung browser ini.'));else document.exitFullscreen?.();}
function textMenu(action){if(action==='save')saveNote(false);else if(action==='saveas')saveNote(false,true);else if(action==='new')newNote();else if(action==='open')openNote();}
function modalButton(i){const before=R.modal;if(!before)return;const b=before.buttons[i];if(!b)return;const result=b.cb?.();if(R.modal===before&&result!==false)closeModal();}
function prepareViewport(){Object.values(R.windows).forEach(w=>{if(w.max){w.w=innerWidth;w.h=innerHeight-60;}else{w.x=Math.max(0,Math.min(w.x,innerWidth-w.w));w.y=Math.max(0,Math.min(w.y,innerHeight-60-w.h));}});renderWindows();}
window.addEventListener('resize',prepareViewport);
function backToStartOnEscape(){if(R.powerOpen){R.powerOpen=false;by('powerFlyout').classList.add('hide');return;}if(R.startOpen){R.startOpen=false;renderStart();renderTaskbar();return;}if(R.modal){closeModal();return;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')backToStartOnEscape();if(e.key==='Enter'&&document.activeElement?.id==='studentName'){powerOn();e.preventDefault();}if(R.powered&&!R.modal&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&R.focused==='notepad'){e.preventDefault();saveNote(false);}if(R.powered&&!R.modal&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&R.focused==='notepad'){e.preventDefault();newNote();}});
document.addEventListener('input',e=>{if(e.target.matches('[data-notearea]'))noteUpdated(e.target.value);if(e.target.id==='startSearchInput'){const where=e.target.selectionStart;R.search=e.target.value;renderStart();const inp=by('startSearchInput');inp?.focus();inp?.setSelectionRange(where,where);}});
document.addEventListener('dblclick',e=>{const desktop=e.target.closest('[data-desktop-app]');if(desktop){launch(desktop.dataset.desktopApp,'desktop');return;}const item=e.target.closest('[data-file-folder],[data-file-id]');if(item){if(item.dataset.fileFolder)changeExplorer(item.dataset.fileFolder);else openFile(item.dataset.fileId);}});
document.addEventListener('click',e=>{const t=e.target;const m=t.closest('[data-modal-button]');if(m){modalButton(Number(m.dataset.modalButton));return;}const sel=t.closest('[data-select-mission]');if(sel){chooseMission(Number(sel.dataset.selectMission));return;}const f=t.closest('[data-modal-open-file]');if(f){const id=f.dataset.modalOpenFile;closeModal();openFile(id);return;}if(t.id==='bootPower'||t.closest('#bootPower')){powerOn();return;}const action=t.closest('[data-win-action]');if(action){const id=action.dataset.app,which=action.dataset.winAction;if(which==='min')minimizeWin(id);else if(which==='max')maximizeWin(id);else closeWin(id);return;}const tb=t.closest('[data-task-app]');if(tb){taskApp(tb.dataset.taskApp);return;}if(t.closest('[data-start-toggle]')){startToggle();return;}if(t.closest('[data-power-toggle]')){powerToggle();return;}const cmd=t.closest('[data-power-command]');if(cmd){const c=cmd.dataset.powerCommand;if(c==='shutdown')shutDown();else toast((c==='restart'?'Restart':'Sleep')+' tersedia sebagai pengenalan. Gunakan Shut down untuk misi penutup.');return;}const launchButton=t.closest('[data-start-app]');if(launchButton){launch(launchButton.dataset.startApp,launchButton.dataset.source);return;}const saveFolder=t.closest('[data-save-folder]');if(saveFolder){R.saveFolder=saveFolder.dataset.saveFolder;document.querySelectorAll('.save-folder').forEach(x=>x.classList.toggle('chosen',x.dataset.saveFolder===R.saveFolder));const path=by('savePath');if(path)path.textContent='Lokasi: Documents'+(R.saveFolder==='Documents'?'':' › '+R.saveFolder);return;}const op=t.closest('[data-file-op]');if(op){explorerOperation(op.dataset.fileOp);return;}const row=t.closest('.file-row');if(row){R.selectedFile=row.dataset.fileId;document.querySelectorAll('.file-row').forEach(x=>x.classList.toggle('selected',x===row));return;}const folder=t.closest('[data-folder]');if(folder){changeExplorer(folder.dataset.folder);return;}if(t.closest('[data-explorer-back]')){changeExplorer('Home');return;}const noteAction=t.closest('[data-note-action]');if(noteAction){textMenu(noteAction.dataset.noteAction);return;}const calc=t.closest('[data-calc]');if(calc){calculator(calc.dataset.calc);return;}if(t.closest('[data-dock-toggle]')){R.dockCollapsed=!R.dockCollapsed;renderHud();return;}if(t.closest('[data-check-mission]')){evaluate(true);return;}if(t.closest('[data-toggle-hint]')){R.signals.showHint=!R.signals.showHint;renderHud();return;}if(t.closest('[data-next-mission]')){nextMission();return;}if(t.closest('[data-open-missions]')){showMissions();return;}if(t.closest('[data-export]')){exportProgress();return;}if(t.closest('[data-import]')){by('importPick').click();return;}if(t.closest('[data-open-teacher]')){teacherDialog();return;}if(t.closest('[data-fullscreen]')){toggleFull();return;}if(t.closest('[data-open-reset]')){resetDialog();return;}if(t.closest('[data-show-final]')){showFinal();return;}
 if(R.powerOpen&&!t.closest('#powerFlyout')){R.powerOpen=false;by('powerFlyout').classList.add('hide');}if(R.startOpen&&!t.closest('#startMenu')&&!t.closest('.taskbar')){R.startOpen=false;renderStart();renderTaskbar();}
});
function beginPointer(e){const node=e.target.closest('.window');if(!node)return;const app=node.dataset.window;if(R.focused!==app){R.focused=app;R.windows[app].z=++R.nextZ;document.querySelectorAll('.window').forEach(w=>{w.classList.toggle('inactive',w.dataset.window!==app);w.style.zIndex=R.windows[w.dataset.window]?.z||10;});renderTaskbar();}
 if(e.button!==0)return;const res=e.target.closest('[data-resize-window]');const top=e.target.closest('[data-drag-window]');if(!res&&!top)return;if(e.target.closest('.title-actions button'))return;const w=R.windows[app];if(w.max)return;R.drag={app,kind:res?'resize':'move',sx:e.clientX,sy:e.clientY,orig:{x:w.x,y:w.y,w:w.w,h:w.h},element:node};e.preventDefault();}
document.addEventListener('pointerdown',beginPointer);
document.addEventListener('pointermove',e=>{const drag=R.drag;if(!drag)return;const w=R.windows[drag.app];if(!w){R.drag=null;return;}const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(drag.kind==='move'){w.x=Math.max(0,Math.min(innerWidth-w.w,drag.orig.x+dx));w.y=Math.max(0,Math.min(innerHeight-60-40,drag.orig.y+dy));drag.element.style.left=w.x+'px';drag.element.style.top=w.y+'px';}else{w.w=Math.max(300,Math.min(innerWidth-w.x,drag.orig.w+dx));w.h=Math.max(215,Math.min(innerHeight-60-w.y,drag.orig.h+dy));drag.element.style.width=w.w+'px';drag.element.style.height=w.h+'px';}});
document.addEventListener('pointerup',e=>{const drag=R.drag;if(!drag)return;R.drag=null;const w=R.windows[drag.app];if(!w)return;if(drag.app==='notepad'&&drag.kind==='move'&&(Math.abs(w.x-drag.orig.x)>45||Math.abs(w.y-drag.orig.y)>45))R.signals.draggedNotepad=true;if(drag.app==='notepad'&&drag.kind==='resize'&&(Math.abs(w.w-drag.orig.w)>50||Math.abs(w.h-drag.orig.h)>50))R.signals.resizedNotepad=true;evaluate(false);renderHud();placeHud();});
const importInput=document.createElement('input');importInput.type='file';importInput.accept='.json,application/json';importInput.id='importPick';importInput.style.display='none';document.body.appendChild(importInput);importInput.addEventListener('change',()=>{importProgress(importInput.files?.[0]);importInput.value='';});
by('studentName').value=S.name;
if(S.name)by('bootStatus').textContent='Progres sebelumnya tersedia. Nyalakan komputer untuk melanjutkan.';
